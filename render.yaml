services:
  - type: web
    name: church-platform-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: chmod +x backend/startup.sh && cd backend && bash startup.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: WEB_CONCURRENCY
        value: "4"
      - key: ADMIN_PASSWORD
        value: "changeme123"