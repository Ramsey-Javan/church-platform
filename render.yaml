services:
  - type: web
    name: church-platform-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: cd backend && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: cd backend && gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: WEB_CONCURRENCY
        value: "4"

  - type: static_site
    name: church-platform-web
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    publishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://church-platform-api.onrender.com/api/v1
        